<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora básica | Mariana Loaiza</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <main>
<a class="back" href="https://loaizamariana333-pixel.github.io/portafolio-programacion-mariana-loaiza/">← Volver al portafolio</a>    <p class="eyebrow">EJERCICIO DE PRÁCTICA 01</p>
    <h1>Calculadora básica</h1>
    <p>Realiza operaciones aritméticas sencillas. Puedes usar el teclado o los botones.</p>

    <section class="calc" aria-label="Calculadora">
      <output id="display" aria-live="polite">0</output>
      <div class="keys">
        <button data-value="7">7</button><button data-value="8">8</button>
        <button data-value="9">9</button><button class="op" data-value="/">÷</button>
        <button data-value="4">4</button><button data-value="5">5</button>
        <button data-value="6">6</button><button class="op" data-value="*">×</button>
        <button data-value="1">1</button><button data-value="2">2</button>
        <button data-value="3">3</button><button class="op" data-value="-">−</button>
        <button data-value="0">0</button><button data-value=".">.</button>
        <button class="clear" data-action="clear">C</button>
        <button class="op" data-value="+">+</button>
        <button class="equal" data-action="equals">Calcular</button>
      </div>
    </section>

    <p class="hint">Práctica: estudia cómo se controlan los botones y se validan las operaciones.</p>
  </main>
  <script src="calculadora.js"></script>
</body>
</html>

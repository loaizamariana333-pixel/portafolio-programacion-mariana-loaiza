<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de tareas | Mariana Loaiza</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <main>
<a class="back" href="https://loaizamariana333-pixel.github.io/portafolio-programacion-mariana-loaiza/">← Volver al portafolio</a>    <p class="eyebrow">EJERCICIO DE PRÁCTICA 02</p>
    <h1>Lista de tareas</h1>
    <p>Agrega pendientes y márcalos cuando estén listos. Tus tareas se guardan en este navegador.</p>

    <form id="task-form">
      <label class="sr-only" for="task-input">Nueva tarea</label>
      <input id="task-input" maxlength="90" placeholder="Escribe una tarea…" required>
      <button type="submit">Agregar</button>
    </form>

    <p id="count" class="count" aria-live="polite"></p>
    <ul id="task-list"></ul>
    <p class="hint">Práctica: revisa los arreglos, el DOM y localStorage en tareas.js.</p>
  </main>
  <script src="tareas.js"></script>
</body>
</html>

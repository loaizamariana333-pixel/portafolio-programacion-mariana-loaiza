<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz de programación | Mariana Loaiza</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <main>
    <a class="back" href="index.html">← Volver al portafolio</a>
    <p class="eyebrow">EJERCICIO DE PRÁCTICA 03</p>
    <h1>Quiz de programación</h1>
    <p>Responde tres preguntas básicas y revisa tu puntaje.</p>

    <section id="quiz" class="quiz">
      <p id="progress" class="count"></p>
      <h2 id="question"></h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" aria-live="polite"></p>
      <button id="next" type="button" disabled>Siguiente</button>
    </section>

    <p class="hint">Práctica: estudia cómo se comprueba cada respuesta y se lleva el puntaje.</p>
  </main>
  <script src="quiz.js"></script>
</body>
</html>
